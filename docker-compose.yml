# ── EventLens v1 ─────────────────────────────────────────────────────────
# Usage:
#   cp .env.example .env   # fill in your keys
#   docker compose up --build
#   open http://localhost:8080
#
# Single published port: ${WEB_PORT:-8080}
# No CORS — nginx reverse-proxies /api to backend.

services:
  # ── Backend (FastAPI + uvicorn) ────────────────────────────────────────
  backend:
    build:
      # Build context is the project root so scripts/ and config/ are available
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DISKCACHE_DIR: /app/.cache
    volumes:
      - cache_vol:/app/.cache
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    expose:
      - "8000"

  # ── Web (Vite build + nginx) ───────────────────────────────────────────
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    ports:
      - "${WEB_PORT:-8080}:8080"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  cache_vol:
