# EventLens nginx config
# - Serves the Vite SPA on port 8080
# - Reverse-proxies /api/* to the FastAPI backend
# - SSE-safe: proxy buffering off, long read timeout, X-Accel-Buffering header

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── /api proxy → backend ──────────────────────────────────────────────
    location /api/ {
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;

        # Required for SSE (Server-Sent Events)
        proxy_set_header   Connection          "";
        proxy_set_header   Host                $host;
        proxy_set_header   X-Real-IP           $remote_addr;
        proxy_set_header   X-Forwarded-For     $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto   $scheme;

        # Disable all buffering so SSE chunks reach the browser immediately
        proxy_buffering            off;
        proxy_cache                off;
        proxy_read_timeout         300s;   # keep SSE connections alive
        proxy_send_timeout         300s;
        proxy_connect_timeout      10s;

        # Tell nginx (and any CDN layer) not to buffer this response
        add_header X-Accel-Buffering no always;
    }

    # ── SPA fallback ──────────────────────────────────────────────────────
    # All non-API, non-asset routes serve index.html (client-side routing)
    location / {
        try_files $uri $uri/ /index.html;

        # Disable caching for index.html so deploys are picked up immediately
        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        }
    }

    # ── Static assets — long-lived cache (Vite hashes filenames) ─────────
    location ~* \.(js|css|woff2?|ttf|otf|eot|svg|png|ico|webp|avif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Compression
    gzip            on;
    gzip_types      text/plain text/css application/javascript application/json
                    image/svg+xml font/woff2;
    gzip_min_length 1024;
    gzip_vary       on;
}
